<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>距离 · 节日倒计时</title>
<style>
  :root{
    --bg:#080b12;--panel:#121826;--line:#242e42;
    --text:#e5eaf3;--muted:#8a96ac;--dim:#5d687d;
    --accent:#e5484d;--cyan:#5cc8e8;--amber:#e8b45c;--green:#6ec9a4;--violet:#a98be8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{background:radial-gradient(ellipse 70% 40% at 50% -10%,rgba(92,200,232,.1),transparent 70%),var(--bg);
    min-height:100vh;min-height:100dvh;padding:0 18px calc(50px + env(safe-area-inset-bottom))}
  .wrap{max-width:680px;margin:0 auto}
  a.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;
    font-size:12px;padding:18px 0 0;font-family:ui-monospace,monospace}
  a.back:hover{color:var(--accent)}
  header{padding:22px 0 18px}
  h1{font-family:Georgia,"Songti SC",serif;font-size:27px;letter-spacing:.08em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:12.5px;margin:0;line-height:1.8}

  .hero{position:relative;overflow:hidden;background:linear-gradient(155deg,#161d2c,#0c1019);
    border:1px solid var(--line);border-radius:18px;padding:26px 24px 22px;margin-top:20px}
  .hero::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.7}
  .hero .label{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--cyan);letter-spacing:.18em}
  .hero .name{font-family:Georgia,"Songti SC",serif;font-size:30px;margin:10px 0 2px;letter-spacing:.06em}
  .hero .date{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
  .days{display:flex;align-items:baseline;gap:10px;margin:18px 0 4px}
  .days b{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:64px;line-height:1;
    font-weight:600;color:var(--amber);letter-spacing:-.04em}
  .days span{color:var(--muted);font-size:14px}
  .clock{font-family:ui-monospace,monospace;font-size:13px;color:var(--muted);letter-spacing:.1em}
  .clock i{font-style:normal;color:var(--text)}
  .track{height:4px;border-radius:4px;background:var(--line);margin:20px 0 8px;overflow:hidden}
  .track div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--amber));border-radius:4px;transition:width .5s}
  .heroFoot{display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px;font-family:ui-monospace,monospace}
  .heroActions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;
    padding:8px 12px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .btn.primary{border-color:rgba(92,200,232,.4);color:var(--cyan)}

  .bar{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 6px}
  .tab{background:none;border:1px solid var(--line);color:var(--muted);font-size:11.5px;
    padding:7px 12px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.16s}
  .tab:hover{border-color:#3a465e;color:var(--text)}
  .tab.on{background:rgba(92,200,232,.1);border-color:var(--cyan);color:var(--cyan)}
  .hint{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--dim);margin:12px 0 2px}

  .list{display:flex;flex-direction:column;margin-top:8px}
  .row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;color:inherit;
    border:none;border-bottom:1px solid var(--line);padding:14px 4px;cursor:pointer;font-family:inherit;transition:.15s}
  .row:hover{background:rgba(255,255,255,.02)}
  .row.on{background:rgba(92,200,232,.05)}
  .row .ico{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
  .row .body{flex:1;min-width:0}
  .row .nm{font-size:14px;margin-bottom:5px}
  .row .meta{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
  .row .meta em{font-style:normal;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .row .cnt{font-family:ui-monospace,monospace;font-size:20px;color:var(--amber);flex:0 0 auto;min-width:52px;text-align:right}
  .row .cnt small{font-size:10px;color:var(--dim)}
  .row .del{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;
    font-size:11px;padding:4px 8px;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .row .del:hover{color:var(--accent);border-color:var(--accent)}

  .addBox{margin-top:22px;border:1px dashed var(--line);border-radius:14px;padding:18px}
  .addBox h3{font-size:13px;color:var(--muted);margin:0 0 14px;font-weight:500;font-family:ui-monospace,monospace}
  .fields{display:flex;gap:8px;flex-wrap:wrap}
  .fields input{background:#0c1019;border:1px solid var(--line);border-radius:8px;color:var(--text);
    padding:9px 11px;font-size:12.5px;font-family:inherit;min-width:0}
  .fields input[type=text]{flex:1 1 150px}
  .fields input[type=date]{flex:0 1 160px;color-scheme:dark}
  .fields .btn{color:var(--cyan);border-color:rgba(92,200,232,.4)}
  .msg{font-size:11px;color:var(--green);min-height:16px;margin-top:10px;font-family:ui-monospace,monospace}

  footer{text-align:center;color:var(--dim);font-size:10.5px;font-family:ui-monospace,monospace;
    margin-top:34px;line-height:2}
  @media(max-width:520px){
    .days b{font-size:52px}.hero{padding:22px 18px}
    .row .nm{font-size:13px}.row .cnt{font-size:17px;min-width:44px}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 返回工具箱</a>
  <header>
    <h1>距离</h1>
    <p class="sub">下一个节日还有多远？点列表里的任意一项，把它放到最上面。</p>
  </header>

  <section class="hero" id="hero"></section>

  <div class="bar" id="tabs"></div>
  <div class="hint" id="hint">按剩余天数排序 · 农历节日日期表覆盖 2026—2030 年</div>
  <div class="list" id="list"></div>

  <div class="addBox">
    <h3>+ 添加自己的纪念日</h3>
    <div class="fields">
      <input type="text" id="cName" placeholder="例如：生日、演唱会、考试" maxlength="20">
      <input type="date" id="cDate">
      <button class="btn" id="addBtn">添加</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <footer>农历日期依据公开日历表 · 自定义事件仅保存在本机</footer>
</div>

<script>
(function(){
'use strict';
const KEY='countdown_custom_v1', PIN='countdown_pin_v1';

// 农历 / 节气节日：公历日期表（2026—2030）
const SPECIAL={
  spring:{name:'春节',icon:'🧧',type:'传统',d:{2026:'02-17',2027:'02-06',2028:'01-26',2029:'02-13',2030:'02-03'}},
  lantern:{name:'元宵节',icon:'🏮',type:'传统',d:{2026:'03-03',2027:'02-20',2028:'02-09',2029:'02-27',2030:'02-17'}},
  qingming:{name:'清明节',icon:'🌿',type:'传统',d:{2026:'04-05',2027:'04-05',2028:'04-04',2029:'04-04',2030:'04-05'}},
  dragon:{name:'端午节',icon:'🎋',type:'传统',d:{2026:'06-19',2027:'06-09',2028:'05-28',2029:'06-16',2030:'06-05'}},
  qixi:{name:'七夕',icon:'💌',type:'传统',d:{2026:'08-19',2027:'08-08',2028:'08-26',2029:'08-16',2030:'08-05'}},
  midautumn:{name:'中秋节',icon:'🌕',type:'传统',d:{2026:'09-25',2027:'09-15',2028:'10-03',2029:'09-22',2030:'09-12'}},
  double9:{name:'重阳节',icon:'🍂',type:'传统',d:{2026:'10-18',2027:'10-08',2028:'10-26',2029:'10-16',2030:'10-05'}},
  winter:{name:'冬至',icon:'❄️',type:'传统',d:{2026:'12-22',2027:'12-22',2028:'12-21',2029:'12-21',2030:'12-22'}}
};
// 固定公历节日
const FIXED=[
  {id:'newyear',name:'元旦',icon:'🎊',type:'法定',m:1,day:1},
  {id:'valentine',name:'情人节',icon:'💝',type:'西方',m:2,day:14},
  {id:'women',name:'妇女节',icon:'🌸',type:'纪念',m:3,day:8},
  {id:'arbor',name:'植树节',icon:'🌳',type:'纪念',m:3,day:12},
  {id:'april',name:'愚人节',icon:'🤡',type:'西方',m:4,day:1},
  {id:'labor',name:'劳动节',icon:'🛠️',type:'法定',m:5,day:1},
  {id:'children',name:'儿童节',icon:'🎈',type:'纪念',m:6,day:1},
  {id:'party',name:'建党节',icon:'🚩',type:'纪念',m:7,day:1},
  {id:'army',name:'建军节',icon:'🎖️',type:'纪念',m:8,day:1},
  {id:'teacher',name:'教师节',icon:'📚',type:'纪念',m:9,day:10},
  {id:'national',name:'国庆节',icon:'🇨🇳',type:'法定',m:10,day:1},
  {id:'halloween',name:'万圣节',icon:'🎃',type:'西方',m:10,day:31},
  {id:'xmasEve',name:'平安夜',icon:'🔔',type:'西方',m:12,day:24},
  {id:'xmas',name:'圣诞节',icon:'🎄',type:'西方',m:12,day:25}
];
const FILTERS=[{id:'all',name:'全部'},{id:'法定',name:'法定假期'},{id:'传统',name:'传统节日'},{id:'西方',name:'西洋节日'},{id:'custom',name:'我的纪念日'}];

const $=id=>document.getElementById(id);
const startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const week=d=>'日一二三四五六'[d.getDay()];

function nextDate(item, today){
  if(item.d){
    for(let y=today.getFullYear();y<=today.getFullYear()+5;y++){
      if(item.d[y]){
        const dt=new Date(y+'-'+item.d[y]+'T00:00:00');
        if(dt>=today)return dt;
      }
    }
    return null;
  }
  let dt=new Date(today.getFullYear(),item.m-1,item.day);
  if(dt<today)dt=new Date(today.getFullYear()+1,item.m-1,item.day);
  return dt;
}
function daysUntil(date,today){return Math.round((startOfDay(date)-today)/86400000);}

function allItems(){
  const today=startOfDay(new Date());
  const out=[];
  for(const id in SPECIAL){
    const s=SPECIAL[id],dt=nextDate(s,today);
    if(dt)out.push({id:id,name:s.name,icon:s.icon,type:s.type,date:dt,days:daysUntil(dt,today)});
  }
  for(const f of FIXED){
    const dt=nextDate(f,today);
    out.push({id:f.id,name:f.name,icon:f.icon,type:f.type,date:dt,days:daysUntil(dt,today)});
  }
  let custom=[];
  try{custom=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){}
  for(const c of custom){
    const parts=(c.date||'').split('-').map(Number);
    if(parts.length!==3)continue;
    let dt=new Date(parts[0],parts[1]-1,parts[2]);
    if(dt<today)dt=new Date(parts[0]+1,parts[1]-1,parts[2]);
    out.push({id:c.id,name:c.name,icon:'⭐',type:'custom',date:dt,days:daysUntil(dt,today),custom:true});
  }
  return out.sort((a,b)=>a.days-b.days);
}

let current='all', pinned=null, tick=null;
try{pinned=localStorage.getItem(PIN);}catch(e){}

function renderHero(){
  const items=allItems();
  let it=items.find(x=>x.id===pinned);
  if(!it){it=items[0];pinned=it&&it.id;}
  if(!it){$('hero').innerHTML='<div class="label">NO EVENT</div>';return;}
  const d=it.date, now=new Date();
  const diff=Math.max(0,d.getTime()-now.getTime());
  const h=Math.floor(diff/3600000), m=Math.floor(diff%3600000/60000), s=Math.floor(diff%60000/1000);
  const y0=new Date(now.getFullYear(),0,1), y1=new Date(now.getFullYear()+1,0,1);
  const pct=Math.min(100,Math.max(0,(now-y0)/(y1-y0)*100));
  $('hero').innerHTML=
    '<div class="label">NEXT UP · 距离下一个'+it.type+'</div>'+
    '<div class="name">'+it.icon+' '+it.name+'</div>'+
    '<div class="date">'+fmt(d)+' · 星期'+week(d)+'</div>'+
    '<div class="days"><b>'+it.days+'</b><span>天</span></div>'+
    '<div class="clock"><i>'+String(h).padStart(2,'0')+'</i> 小时 <i>'+String(m).padStart(2,'0')+'</i> 分 <i>'+String(s).padStart(2,'0')+'</i> 秒</div>'+
    '<div class="track"><div style="width:'+pct.toFixed(2)+'%"></div></div>'+
    '<div class="heroFoot"><span>今年已过去 '+pct.toFixed(1)+'%</span><span>'+(it.days===0?'就是今天！':'Keep going →')+'</span></div>'+
    '<div class="heroActions">'+
      '<button class="btn primary" id="copyBtn">复制倒计时</button>'+
      (it.custom?'':'<button class="btn" id="nextBtn">看下一个</button>')+
    '</div>';
  $('copyBtn').onclick=()=>{
    const txt='距离'+(it.days===0?'':it.name)+'还有 '+it.days+' 天（'+fmt(d)+'）';
    const done=()=>{ $('copyBtn').textContent='已复制'; setTimeout(()=>{if($('copyBtn'))$('copyBtn').textContent='复制倒计时';},1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(()=>{});
    else{done();}
  };
  const nb=$('nextBtn');
  if(nb)nb.onclick=()=>{
    const idx=items.findIndex(x=>x.id===it.id);
    pinned=items[(idx+1)%items.length].id;
    try{localStorage.setItem(PIN,pinned);}catch(e){}
    renderAll();
  };
}

function renderTabs(){
  const box=$('tabs');box.innerHTML='';
  FILTERS.forEach(f=>{
    const b=document.createElement('button');b.className='tab'+(current===f.id?' on':'');b.textContent=f.name;
    b.onclick=()=>{current=f.id;renderAll();};box.appendChild(b);
  });
}
function renderList(){
  const items=allItems().filter(x=>current==='all'||x.type===current);
  const box=$('list');
  if(!items.length){box.innerHTML='<div class="hint">这里还没有项目，添加一个自己的纪念日吧</div>';return;}
  box.innerHTML=items.map(it=>
    '<button class="row'+(it.id===pinned?' on':'')+'" data-id="'+it.id+'">'+
      '<span class="ico">'+it.icon+'</span>'+
      '<span class="body"><span class="nm">'+it.name+'</span>'+
      '<span class="meta"><span>'+fmt(it.date)+'</span><span>周'+week(it.date)+'</span><em>'+it.type+'</em></span></span>'+
      '<span class="cnt">'+it.days+'<small> 天</small></span>'+
      (it.custom?'<span class="del" data-del="'+it.id+'">删</span>':'')+
    '</button>').join('');
  box.querySelectorAll('.row').forEach(row=>{
    row.onclick=e=>{
      if(e.target&&e.target.dataset&&e.target.dataset.del){
        const id=e.target.dataset.del;
        let custom=[];try{custom=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(err){}
        custom=custom.filter(c=>c.id!==id);
        localStorage.setItem(KEY,JSON.stringify(custom));
        if(pinned===id)pinned=null;
        renderAll();flash('已删除');
        return;
      }
      pinned=row.dataset.id;
      try{localStorage.setItem(PIN,pinned);}catch(err){}
      renderAll();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
}
function flash(t){$('msg').textContent=t;setTimeout(()=>{$('msg').textContent='';},1800);}

function renderAll(){renderHero();renderTabs();renderList();}

$('addBtn').onclick=()=>{
  const name=$('cName').value.trim(), date=$('cDate').value;
  if(!name||!date){flash('请填写名称和日期');return;}
  let custom=[];try{custom=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){}
  custom.push({id:'c_'+Date.now(),name:name,date:date});
  try{localStorage.setItem(KEY,JSON.stringify(custom));}catch(e){}
  $('cName').value='';$('cDate').value='';
  current='custom';pinned='c_'+(custom[custom.length-1].id||'');
  pinned=custom[custom.length-1].id;
  renderAll();flash('已添加，可在「我的纪念日」里查看');
};

renderAll();
clearInterval(tick);
tick=setInterval(renderHero,1000);
})();
</script>
</body>
</html>
