<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>今天吃什么 · 决策骰子</title>
<style>
  :root{
    --bg:#080b12;--panel:#121826;--panel2:#171e2e;--line:#242e42;
    --text:#e5eaf3;--muted:#8a96ac;--dim:#5d687d;
    --accent:#e5484d;--amber:#e8b45c;--cyan:#5cc8e8;--green:#6ec9a4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{background:radial-gradient(ellipse 70% 45% at 50% -8%,rgba(232,180,92,.09),transparent 70%),var(--bg);
    min-height:100vh;min-height:100dvh;padding:0 18px calc(50px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto}
  a.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:12px;
    padding:18px 0 0;font-family:ui-monospace,monospace}
  a.back:hover{color:var(--amber)}
  header{text-align:center;padding:26px 0 22px}
  h1{font-family:Georgia,"Songti SC",serif;font-size:28px;letter-spacing:.1em;margin:0 0 8px}
  .sub{color:var(--muted);font-size:12.5px;margin:0;line-height:1.8}

  /* 转盘 */
  .wheel-wrap{margin:10px 0 26px;display:flex;justify-content:center}
  .slot{
    position:relative;width:100%;max-width:400px;height:150px;
    background:linear-gradient(180deg,var(--panel),var(--bg-soft,#0e121c));
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
  }
  .slot::before,.slot::after{content:"";position:absolute;left:0;right:0;height:44px;z-index:3;pointer-events:none}
  .slot::before{top:0;background:linear-gradient(180deg,var(--panel),transparent)}
  .slot::after{bottom:0;background:linear-gradient(0deg,var(--panel),transparent)}
  .reel{position:absolute;left:0;right:0;top:0;transition:transform 2.4s cubic-bezier(.15,.85,.2,1)}
  .reel .item{height:150px;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Songti SC",serif;font-size:30px;letter-spacing:.08em;color:var(--dim)}
  .reel .item.center{color:var(--amber);font-size:34px}
  .pointer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scaleX(0);
    width:calc(100% - 24px);height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);
    z-index:4;opacity:0;transition:.3s}
  .pointer.on{opacity:1;transform:translate(-50%,-50%) scaleX(1)}

  .roll-btn{
    display:block;width:100%;max-width:400px;margin:0 auto;padding:16px;
    background:var(--amber);color:#1a1206;border:none;border-radius:12px;
    font-size:16px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:.18s;font-family:inherit
  }
  .roll-btn:hover:not(:disabled){background:#f0c46a;transform:translateY(-2px)}
  .roll-btn:disabled{opacity:.6;cursor:wait}
  .hint{text-align:center;color:var(--dim);font-size:11px;font-family:ui-monospace,monospace;margin-top:10px}

  .result{
    text-align:center;margin:24px 0 8px;padding:20px;border:1px solid var(--line);
    border-radius:14px;background:var(--panel);min-height:84px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .result .label{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim);letter-spacing:.2em;margin-bottom:8px}
  .result .pick{font-family:Georgia,"Songti SC",serif;font-size:24px;color:var(--amber);letter-spacing:.06em}
  .result.empty .pick{color:var(--dim);font-size:16px}
  .result .again{margin-top:12px;background:none;border:1px solid var(--line);color:var(--muted);
    padding:7px 16px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
  .result .again:hover{border-color:var(--amber);color:var(--amber)}

  .section{margin-top:30px}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .section-head h2{font-size:14px;margin:0;font-weight:600;letter-spacing:.04em}
  .section-head .count{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim)}
  .section-head .spacer{flex:1}
  .mini-btn{background:none;border:1px solid var(--line);color:var(--muted);font-size:11px;
    padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit}
  .mini-btn:hover{color:var(--accent);border-color:var(--accent)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--text)}
  .chip .x{color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:0 1px}
  .chip .x:hover{color:var(--accent)}
  .chip.custom{border-color:rgba(92,200,232,.35)}

  .add-row{display:flex;gap:8px;margin-top:12px}
  .add-row input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
  .add-row input:focus{border-color:var(--cyan)}
  .add-row button{background:var(--cyan);color:#06222e;border:none;border-radius:8px;padding:0 16px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .add-row button:hover{background:#7ad8f2}

  .preset{margin-top:14px}
  .preset .lbl{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace;margin-bottom:8px}
  .preset-btns{display:flex;flex-wrap:wrap;gap:7px}
  .preset-btns button{background:none;border:1px dashed var(--line);color:var(--muted);
    padding:6px 11px;border-radius:6px;font-size:11.5px;cursor:pointer;font-family:inherit}
  .preset-btns button:hover{border-color:var(--amber);color:var(--amber)}

  .history{display:flex;flex-direction:column;gap:0}
  .hist-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .hist-item .n{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim);width:24px}
  .hist-item .v{color:var(--text)}
  .hist-item .t{margin-left:auto;color:var(--dim);font-size:11px;font-family:ui-monospace,monospace}
  .hist-empty{color:var(--dim);font-size:12px;padding:12px 2px}

  footer{text-align:center;color:var(--dim);font-size:10.5px;font-family:ui-monospace,monospace;
    margin-top:36px;line-height:2}
  @media(max-width:520px){h1{font-size:24px}.reel .item{font-size:26px}.reel .item.center{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 返回工具箱</a>
  <header>
    <h1>今天吃什么</h1>
    <p class="sub">选择困难症专用。按下按钮，把决定交给命运。</p>
  </header>

  <div class="wheel-wrap">
    <div class="slot">
      <div class="pointer" id="pointer"></div>
      <div class="reel" id="reel"></div>
    </div>
  </div>

  <button class="roll-btn" id="rollBtn">摇 骰 子</button>
  <div class="hint">空格键也可以摇 · 结果会记在下面</div>

  <div class="result empty" id="result">
    <div class="label">TODAY'S PICK</div>
    <div class="pick" id="pick">还没摇，先按上面那个按钮</div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>候选清单</h2>
      <span class="count" id="listCount">0 项</span>
      <span class="spacer"></span>
      <button class="mini-btn" id="resetListBtn">恢复默认</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="add-row">
      <input id="newItem" type="text" placeholder="加一个选项，比如 麻辣烫" maxlength="20">
      <button id="addBtn">添加</button>
    </div>
    <div class="preset">
      <div class="lbl">换一套清单</div>
      <div class="preset-btns" id="presets"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>最近抽中</h2>
      <span class="spacer"></span>
      <button class="mini-btn" id="clearHistBtn">清空</button>
    </div>
    <div class="history" id="history"></div>
  </div>

  <footer>纯前端 · 选项与历史保存在本机浏览器</footer>
</div>

<script>
(function(){
  'use strict';
  const KEY='fooddice_v1';
  const PRESETS={
    '日常':['米饭','面条','麻辣烫','外卖','火锅','沙拉','饺子','盖饭','烧烤','便当'],
    '下馆子':['火锅','烤肉','日料','川菜','粤菜','泰餐','西餐','自助','烧烤','小龙虾'],
    '快手':['泡面','蛋炒饭','三明治','煮饺子','外卖','便当','拌面','粥','煎饼','沙拉'],
    '健康':['沙拉','鸡胸肉','糙米饭','清蒸鱼','蔬菜汤','燕麦','牛油果饭','水果','酸奶','玉米'],
    '深夜':['泡面','烧烤','小龙虾','炸鸡','炒粉','螺蛳粉','馄饨','关东煮','肠粉','粥']
  };
  const DEFAULT=PRESETS['日常'];

  function load(){
    try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');
      return {list:Array.isArray(d.list)&&d.list.length?d.list:DEFAULT.slice(), hist:Array.isArray(d.hist)?d.hist:[]};
    }catch(e){return {list:DEFAULT.slice(),hist:[]};}
  }
  let state=load();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  const $=id=>document.getElementById(id);
  const reel=$('reel'), pointer=$('pointer'), rollBtn=$('rollBtn');
  let spinning=false;

  function buildReel(){
    reel.innerHTML='';
    const items=state.list.length?state.list:['先加几个选项'];
    // 重复多轮制造滚动感
    const seq=[];
    for(let r=0;r<3;r++) seq.push(...items);
    seq.push(...items.slice(0,2));
    seq.forEach((t,i)=>{
      const d=document.createElement('div');
      d.className='item'+(i%items.length===0?' center':'');
      d.textContent=t;
      reel.appendChild(d);
    });
  }

  function renderChips(){
    const box=$('chips');box.innerHTML='';
    state.list.forEach((t,i)=>{
      const c=document.createElement('div');c.className='chip';
      const span=document.createElement('span');span.textContent=t;
      const x=document.createElement('span');x.className='x';x.textContent='×';x.title='删除';
      x.onclick=()=>{state.list.splice(i,1);save();renderAll();};
      c.append(span,x);box.appendChild(c);
    });
    $('listCount').textContent=state.list.length+' 项';
  }

  function renderPresets(){
    const box=$('presets');box.innerHTML='';
    Object.keys(PRESETS).forEach(name=>{
      const b=document.createElement('button');b.textContent=name;
      b.onclick=()=>{state.list=PRESETS[name].slice();save();renderAll();};
      box.appendChild(b);
    });
  }

  function renderHistory(){
    const box=$('history');box.innerHTML='';
    if(!state.hist.length){box.innerHTML='<div class="hist-empty">还没有记录，摇一次试试。</div>';return;}
    state.hist.slice(0,12).forEach((h,i)=>{
      const d=document.createElement('div');d.className='hist-item';
      d.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="v"></span><span class="t"></span>';
      d.querySelector('.v').textContent=h.v;
      d.querySelector('.t').textContent=h.t;
      box.appendChild(d);
    });
  }

  function renderAll(){buildReel();renderChips();renderPresets();renderHistory();}

  function roll(){
    if(spinning||!state.list.length)return;
    spinning=true;rollBtn.disabled=true;pointer.classList.add('on');
    $('result').classList.add('empty');
    $('pick').textContent='命运正在转动…';
    // 归零后重新构建，确保从同一起点
    reel.style.transition='none';reel.style.transform='translateY(0)';
    buildReel();
    void reel.offsetHeight;
    const items=state.list;
    const target=Math.floor(Math.random()*items.length);
    // 落到第三轮的目标项
    const finalIndex=items.length*2+target;
    const itemH=150;
    reel.style.transition='transform 2.4s cubic-bezier(.15,.85,.2,1)';
    reel.style.transform='translateY(-'+(finalIndex*itemH)+'px)';
    setTimeout(()=>{
      const pick=items[target];
      const now=new Date();
      const ts=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      state.hist.unshift({v:pick,t:ts});
      if(state.hist.length>30)state.hist.pop();
      save();
      $('result').classList.remove('empty');
      $('pick').textContent=pick;
      renderHistory();
      spinning=false;rollBtn.disabled=false;
    },2500);
  }

  rollBtn.onclick=roll;
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();roll();}
  });
  $('addBtn').onclick=()=>{
    const inp=$('newItem'),v=inp.value.trim();
    if(!v)return;
    if(state.list.includes(v)){inp.value='';return;}
    state.list.push(v);inp.value='';save();renderAll();
  };
  $('newItem').addEventListener('keydown',e=>{if(e.key==='Enter')$('addBtn').click();});
  $('resetListBtn').onclick=()=>{state.list=DEFAULT.slice();save();renderAll();};
  $('clearHistBtn').onclick=()=>{state.hist=[];save();renderHistory();};

  // 结果区的"再来一次"
  const again=document.createElement('button');
  again.className='again';again.textContent='再摇一次';again.onclick=roll;
  $('result').appendChild(again);

  renderAll();
})();
</script>
</body>
</html>
