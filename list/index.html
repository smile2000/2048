<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>完整列表 · 鱼塘</title>
<style>
  :root {
    --bg:#080b12; --panel:#121826; --line:#242e42;
    --text:#e5eaf3; --muted:#8a96ac; --dim:#5d687d;
    --accent:#e5484d; --cyan:#5cc8e8; --gold:#e8b45c;
    --amber:#e8b45c; --green:#6ec9a4; --violet:#a98be8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(ellipse 70% 45% at 15% -5%,rgba(92,200,232,.09),transparent 70%),
      radial-gradient(ellipse 60% 40% at 90% 105%,rgba(229,72,77,.08),transparent 70%),
      var(--bg);
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:0 20px calc(40px + env(safe-area-inset-bottom))
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:10;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);opacity:.5}
  .wrap{width:100%;max-width:860px}

  header{padding:64px 0 40px;text-align:center}
  .time{
    font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
    font-size:13px;letter-spacing:.3em;color:var(--accent);margin-bottom:20px;
    display:flex;align-items:center;justify-content:center;gap:10px
  }
  .time::before,.time::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
  .time::after{background:linear-gradient(90deg,var(--accent),transparent)}
  h1{
    font-family:Georgia,"Songti SC","SimSun",serif;
    font-size:36px;letter-spacing:.15em;margin:0 0 14px;font-weight:600
  }
  .sub{color:var(--muted);font-size:13px;line-height:1.9;margin:0 auto;max-width:460px}
  .url{
    display:inline-block;margin-top:22px;font-family:ui-monospace,monospace;font-size:11px;
    color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:6px 12px;letter-spacing:.04em
  }

  .section-label{
    display:flex;align-items:center;gap:12px;margin:36px 0 4px;
    font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
    font-size:11px;letter-spacing:.24em;color:var(--dim)
  }
  .section-label:first-of-type{margin-top:8px}
  .section-label span{color:var(--accent);opacity:.8}
  .section-label i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}
  .card{
    position:relative;display:block;text-decoration:none;color:inherit;
    background:linear-gradient(155deg,var(--panel),#0c1019);
    border:1px solid var(--line);border-radius:16px;padding:30px 28px 28px;
    transition:.22s;overflow:hidden
  }
  .card::before{
    content:"";position:absolute;top:0;left:28px;right:28px;height:1px;
    background:linear-gradient(90deg,transparent,var(--tone),transparent);opacity:.7
  }
  .card:hover{border-color:var(--tone);transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .card .icon{
    width:48px;height:48px;border-radius:12px;display:grid;place-items:center;margin-bottom:22px;
    background:color-mix(in srgb,var(--tone) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--tone) 32%,transparent);color:var(--tone)
  }
  .card .icon svg{width:24px;height:24px}
  .card .path{
    font-family:ui-monospace,monospace;font-size:10px;color:var(--tone);
    letter-spacing:.08em;margin-bottom:10px
  }
  .card h2{
    font-family:Georgia,"Songti SC",serif;font-size:22px;letter-spacing:.05em;
    margin:0 0 10px;font-weight:600
  }
  .card p{margin:0;color:var(--muted);font-size:13px;line-height:1.85;min-height:48px}
  .card .meta{
    display:flex;gap:8px;margin-top:22px;flex-wrap:wrap
  }
  .card .tag{
    font-family:ui-monospace,monospace;font-size:10px;color:var(--dim);
    border:1px solid var(--line);border-radius:5px;padding:4px 8px
  }
  .card .go{
    margin-left:auto;color:var(--tone);font-size:18px;transition:.2s
  }
  .card:hover .go{transform:translateX(4px)}
  .card .go-row{display:flex;align-items:center;margin-top:20px}

  footer{
    margin-top:44px;text-align:center;color:var(--dim);font-size:11px;
    font-family:ui-monospace,monospace;line-height:2;letter-spacing:.04em
  }

  .back{
    display:inline-block;margin-bottom:20px;font-size:12px;color:var(--muted);
    text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;
    transition:.18s
  }
  .back:hover{color:var(--accent);border-color:var(--accent)}

  @media(max-width:640px){
    header{padding:44px 0 28px}
    h1{font-size:28px}
    .grid{grid-template-columns:1fr;gap:14px}
    .card{padding:24px 22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../">← 返回鱼塘</a>
    <h1>完整列表</h1>
    <p class="sub">两个入口，分门别类。<br>游戏合集里有十一款小游戏，工具箱里有四个日常工具。</p>
    <div class="url">dahuangyu.de5.net</div>
  </header>

  <div class="grid">
    <a class="card" href="../games/" style="--tone:var(--violet)">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="6" width="19" height="12" rx="4"/><path d="M7 10v4M5 12h4M16 11h.01M18.5 14h.01"/>
        </svg>
      </div>
      <div class="path">/games</div>
      <h2>游戏合集</h2>
      <p>十一款游戏的总入口：围住小猫、文字游戏、2048、扫雷、数独、SBTI 人格测试等，按分类筛选或直接搜索。</p>
      <div class="meta"><span class="tag">11 款游戏</span><span class="tag">4 个分类</span><span class="tag">分类入口</span></div>
      <div class="go-row"><span class="go">→</span></div>
    </a>

    <a class="card" href="../tools/" style="--tone:var(--cyan)">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.3-3.3a1 1 0 0 0 0-1.4l-1.6-1.6a1 1 0 0 0-1.4 0z"/><path d="M15.5 7.5 4 19v1h1L16.5 8.5"/>
        </svg>
      </div>
      <div class="path">/tools</div>
      <h2>工具箱</h2>
      <p>四个日常小工具的统一入口：佳期可数、天气查询、头条速览，还有「今天吃什么」决策骰子。</p>
      <div class="meta"><span class="tag">4 个工具</span><span class="tag">分类入口</span></div>
      <div class="go-row"><span class="go">→</span></div>
    </a>
  </div>

  <footer>
    <div style="margin-bottom:14px"><a class="back" href="../" style="margin:0">← 返回鱼塘</a></div>
    <div>GITHUB PAGES · 静态站点 · 无需登录</div>
    <div>进度保存在各自浏览器本地</div>
  </footer>
</div>
</body>
</html>
