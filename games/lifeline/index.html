<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>信号 · 生命线互动故事</title>
<style>
  :root{
    --bg:#0a0d14;--panel:#121826;--bubble-in:#1b2231;--bubble-out:#2a3a5c;
    --line:#242e42;--text:#e5eaf3;--muted:#8a96ac;--dim:#5d687d;
    --accent:#5cc8e8;--accent2:#e5484d;--gold:#e8b45c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{background:radial-gradient(ellipse 70% 40% at 50% -10%,rgba(92,200,232,.08),transparent 70%),var(--bg);
    min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  a.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;
    font-size:12px;padding:14px 16px 0;font-family:ui-monospace,monospace}
  a.back:hover{color:var(--accent)}

  .chat-head{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
  .avatar{width:40px;height:40px;border-radius:50%;background:#1d3a4a;display:grid;place-items:center;
    color:var(--accent);font-family:Georgia,serif;font-size:17px;border:1px solid rgba(92,200,232,.3);flex:0 0 auto}
  .chat-head .who{font-size:14px;font-weight:600}
  .chat-head .status{font-size:11px;color:var(--accent);margin-top:2px;display:flex;align-items:center;gap:5px}
  .chat-head .status .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .head-actions{margin-left:auto;display:flex;gap:6px}
  .head-actions button{background:none;border:1px solid var(--line);color:var(--muted);
    font-size:11px;padding:6px 9px;border-radius:7px;cursor:pointer;font-family:inherit}
  .head-actions button:hover{color:var(--accent);border-color:var(--accent)}

  .msgs{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px}
  .day{text-align:center;color:var(--dim);font-size:10.5px;font-family:ui-monospace,monospace;letter-spacing:.1em;margin:4px 0 8px}
  .bubble{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.65;
    white-space:pre-wrap;word-break:break-word;animation:pop .3s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bubble.them{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:4px}
  .bubble.me{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:4px}
  .bubble.sys{align-self:center;background:none;color:var(--dim);font-size:11.5px;font-family:ui-monospace,monospace;
    text-align:center;padding:6px 10px}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:13px 15px;background:var(--bubble-in);
    border-radius:14px;border-bottom-left-radius:4px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:bounce 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

  .choices{padding:8px 16px 18px;display:flex;flex-direction:column;gap:8px;
    border-top:1px solid var(--line);background:rgba(10,13,20,.94)}
  .choices:empty{display:none}
  .choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);
    font-size:13.5px;cursor:pointer;transition:.16s;font-family:inherit;animation:pop .3s ease-out}
  .choice:hover{border-color:var(--accent);background:rgba(92,200,232,.08)}
  .choice .arrow{margin-left:auto;color:var(--dim)}
  .choice:hover .arrow{color:var(--accent)}
  .skip{text-align:center;color:var(--dim);font-size:11px;font-family:ui-monospace,monospace;
    padding:0 16px 14px;cursor:pointer}
  .skip:hover{color:var(--accent)}

  .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    padding:20px;background:rgba(4,6,10,.86);backdrop-filter:blur(5px)}
  .modal.on{display:flex}
  .card{width:min(430px,100%);max-height:86vh;overflow-y:auto;background:#101621;
    border:1px solid var(--line);border-radius:16px;padding:28px;animation:pop .3s ease-out}
  .card h2{font-family:Georgia,"Songti SC",serif;font-size:23px;margin:0 0 6px;letter-spacing:.06em}
  .card .tag{display:inline-block;font-size:10px;font-family:ui-monospace,monospace;color:var(--gold);
    border:1px solid rgba(232,180,92,.4);border-radius:5px;padding:3px 8px;margin-bottom:16px}
  .card p{font-size:13.5px;line-height:1.9;color:var(--muted);white-space:pre-wrap;margin:0 0 10px}
  .card .actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
  .btn{padding:10px 16px;border-radius:9px;font-size:12.5px;cursor:pointer;font-family:inherit;
    border:1px solid var(--line);background:var(--panel);color:var(--text)}
  .btn:hover{border-color:#3a465e}
  .btn.pri{background:var(--accent);color:#06222e;border-color:var(--accent);font-weight:600}
  .end-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .end-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);
    border-radius:9px;font-size:13px;background:var(--panel)}
  .end-item.lock{opacity:.4}
  .end-item b{font-weight:500}
  .end-item span{margin-left:auto;color:var(--dim);font-size:11px;font-family:ui-monospace,monospace}
  @media(max-width:520px){.bubble{font-size:13.5px}}
</style>
</head>
<body>
<div class="app">
  <a class="back" href="../">← 返回游戏合集</a>
  <div class="chat-head">
    <div class="avatar">岚</div>
    <div>
      <div class="who">阿岚</div>
      <div class="status"><span class="dot"></span><span id="statusText">信号微弱 · 在线</span></div>
    </div>
    <div class="head-actions">
      <button id="skipBtn">跳过</button>
      <button id="endBtn">结局</button>
    </div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="choices" id="choices"></div>
  <div class="skip" id="skipHint" style="display:none">点「跳过」可快速显示消息</div>
</div>

<div class="modal" id="modal"><div class="card" id="card"></div></div>

<script>
(function(){
  'use strict';
  const KEY='lifeline_signal_v1';
  const STORY={
    start:{
      msgs:[
        ['them','喂……有人看到吗？'],
        ['them','我是阿岚。我在山里，好像迷路了。手机只剩 8%。'],
        ['me','我在。别慌，先告诉我你现在什么情况。']
      ],
      choices:[
        ['问他在什么位置','location'],
        ['问他有没有受伤','injury'],
        ['让他少说话，保存电量','conserve']
      ]
    },
    location:{
      msgs:[
        ['them','我在一条山脊上，风特别大。'],
        ['them','往东边看有座高压塔，不算远，但中间要下一个陡坡。'],
        ['me','看到塔就有人。小心脚下。']
      ],
      choices:[['让他朝高压塔走','ridge'],['让他留在山脊等天亮','stay']]
    },
    injury:{
      msgs:[
        ['them','下山的时候踩空了，脚踝肿了，走两步就疼。'],
        ['them','包里有绳子和一张急救毯。'],
        ['me','先别乱动。坐着，脚别放低。']
      ],
      choices:[['教他固定脚踝，慢慢挪向高压塔','ridge'],['让他就地扎营过夜','camp']]
    },
    conserve:{
      msgs:[
        ['them','好。'],
        ['sys','四十分钟后'],
        ['them','找到个避风的岩洞。坐标发你了：31°12′N，103°28′E。'],
        ['them','看见远处有座高压塔，可天快黑了。']
      ],
      choices:[['让他趁天亮赶去高压塔','ridge'],['让他在岩洞过夜','camp']]
    },
    ridge:{
      msgs:[
        ['them','我在往塔那边挪。风把说话声都吹散了。'],
        ['them','……到了。塔底下有个小屋，门好像没锁。'],
        ['me','进去！找电话，或者任何能发信号的东西。']
      ],
      choices:[['让他进屋求救','checkhouse'],['让他先在门外观察', 'hesitate']]
    },
    hesitate:{
      msgs:[
        ['them','我在门口站了一会儿。风从背后推我。'],
        ['them','算了，进去。'],
        ['them','里面有张桌子，桌上一部老式电话——线断了。'],
        ['them','但还有个对讲机！']
      ],
      choices:[['让他用对讲机呼救','radio'],['让他先找电源','power']]
    },
    checkhouse:{
      msgs:[
        ['them','门开着。里面……有张桌子，一部老式电话。'],
        ['them','电话线断了。不过桌上有个对讲机。'],
        ['me','试试对讲机，调到应急频道。']
      ],
      choices:[['让他用对讲机呼救','radio'],['让他先找电源','power']]
    },
    power:{
      msgs:[
        ['them','翻到一节电池，装进去了。指示灯亮了。'],
        ['them','喂？喂！有人吗！我是在山里被困的——'],
        ['them','……有人回了！他们说救援队已经在路上！']
      ],
      choices:[['等救援到来','end_rescue_signal']]
    },
    radio:{
      msgs:[
        ['them','我按住了通话键。'],
        ['them','「有人吗？我需要帮助，我在高压塔这边。」'],
        ['them','……沙沙声。然后：「收到，请保持位置，救援已派出。」'],
        ['me','待在屋里，别出去。他们很快到。']
      ],
      choices:[['陪他等救援','end_rescue_signal']]
    },
    stay:{
      msgs:[
        ['them','我留在山脊上了。天黑得很快。'],
        ['them','我开了头灯，用急救毯把自己裹住。'],
        ['me','别睡着。隔几分钟就动一动。']
      ],
      choices:[['陪他说话熬过这一夜','night'],['让他先睡一会儿省电','sleep'],['让他放信号弹','flare']]
    },
    camp:{
      msgs:[
        ['them','我在岩洞里，裹好急救毯了。'],
        ['them','风在外面吼，但这里还行。'],
        ['me','守住体力。我陪你说话。']
      ],
      choices:[['一直陪他聊到天亮','night'],['让他睡一会儿保存体力','sleep'],['让他检查信号弹','flare']]
    },
    night:{
      msgs:[
        ['them','好冷。我在数自己的呼吸，怕一睡着就醒不过来。'],
        ['them','你还在吗？'],
        ['me','在。我一直在。'],
        ['sys','漫长的几个小时'],
        ['them','……天，好像有点亮了。'],
        ['them','东边有光。我看到高压塔了，就在下面。']
      ],
      choices:[['让他天亮后走向高压塔','end_rescue_dawn'],['让他原地等救援','end_rescue_wait']]
    },
    flare:{
      msgs:[
        ['them','找到了！两支信号弹。'],
        ['them','放了一支，红的，特别亮。'],
        ['them','……下面好像有灯光在动。是我看错了吗？']
      ],
      choices:[['让他再放一支','end_rescue_flare'],['让他省着点，等天亮','night']]
    },
    sleep:{
      msgs:[
        ['them','好，我眯一下……就一下……'],
        ['sys','二十分钟过去'],
        ['me','阿岚？'],
        ['sys','没有回复'],
        ['me','阿岚，醒醒？']
      ],
      choices:[['继续呼叫','end_lost']]
    },
    end_rescue_signal:{
      end:'获救 · 信号',
      desc:'直升机在凌晨三点找到了小屋。\n\n阿岚发来最后一条消息：「他们来了。谢谢你一直回我。」\n\n你活下来了——是他活下来了。而你，刚好在那个夜里没有关机。',
      msgs:[['them','他们找到我了。真的有直升机。'],['them','我得走了。谢谢你。']]
    },
    end_rescue_dawn:{
      end:'获救 · 黎明',
      desc:'天亮后，阿岚顺着山坡走向高压塔。\n\n中午，救援队在塔下的小屋找到了他。脚踝骨折，但人没事。\n\n后来他说，那天夜里支撑他的，是手机屏幕上一句「我一直在」。',
      msgs:[['them','我出发了。能看到塔了。'],['them','……我到了。有人在下面喊我。']]
    },
    end_rescue_wait:{
      end:'获救 · 坚守',
      desc:'你没有让他冒险下山。\n\n天亮后一小时，直升机沿着山脊发现了那块反光的急救毯。\n\n有时候，最对的决定就是不动，然后一直说话。',
      msgs:[['them','我听见直升机了！在这儿！']]
    },
    end_rescue_flare:{
      end:'获救 · 火光',
      desc:'第二支信号弹划破夜空。\n\n十五分钟后，一束探照灯从山谷里扫上来。\n\n救援队说，正是那两点红光让他们锁定了位置。',
      msgs:[['them','第二支放出去了！'],['them','他们看见了！那边有人在跑！']]
    },
    end_lost:{
      end:'失联',
      desc:'信号断了。\n\n你把那条「阿岚？」发了十几遍，屏幕始终停在已送达。\n\n第二天，救援队在山脊上找到了人。他睡着了，再没醒过来。\n\n山里的低温不会给人第二次机会。有些夜晚，不能让对方闭眼。',
      msgs:[['sys','连接已中断']]
    }
  };

  let state={node:'start',log:[],endings:[],done:false};
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(d&&STORY[d.node])state=Object.assign(state,d);
  }catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  const $=id=>document.getElementById(id);
  const msgsBox=$('msgs'), choicesBox=$('choices');
  let fast=false, running=false;

  function scroll(){msgsBox.scrollTop=msgsBox.scrollHeight;}
  function addBubble(from,text){
    const el=document.createElement('div');
    el.className='bubble '+from;
    el.textContent=text;
    msgsBox.appendChild(el);
    if(from==='them'&&text.indexOf('？')>=0){} // no-op, keeps logic simple
    state.log.push([from,text]);
    save();scroll();
  }
  const wait=ms=>new Promise(r=>setTimeout(r,fast?40:ms));

  async function play(id){
    if(running)return;
    running=true;
    const node=STORY[id];
    state.node=id;save();
    // 逐条发送消息
    for(const [from,text] of node.msgs){
      if(from==='them'){
        const t=document.createElement('div');t.className='typing';
        t.innerHTML='<i></i><i></i><i></i>';
        msgsBox.appendChild(t);scroll();
        await wait(text.length>28?1100:800);
        t.remove();
      }else{
        await wait(from==='sys'?500:400);
      }
      addBubble(from,text);
      await wait(120);
    }
    running=false;
    if(node.end){
      state.done=true;
      if(!state.endings.includes(node.end))state.endings.push(node.end);
      save();
      setTimeout(()=>showEnd(node),500);
    }else{
      showChoices(node.choices);
    }
  }

  function showChoices(list){
    choicesBox.innerHTML='';
    list.forEach(([label,to],i)=>{
      const b=document.createElement('button');b.className='choice';
      b.innerHTML='<span class="n"></span><span class="l"></span><span class="arrow">→</span>';
      b.querySelector('.n').textContent=String(i+1).padStart(2,'0');
      b.querySelector('.n').style.cssText='font-family:ui-monospace,monospace;font-size:10px;color:var(--dim)';
      b.querySelector('.l').textContent=label;
      b.style.animationDelay=(i*0.06)+'s';
      b.onclick=()=>{
        addBubble('me',label);
        choicesBox.innerHTML='';
        play(to);
      };
      choicesBox.appendChild(b);
    });
  }

  function showEnd(node){
    const card=$('card'),modal=$('modal');
    card.innerHTML=
      '<h2>'+node.end+'</h2>'+
      '<span class="tag">结局已解锁 · '+state.endings.length+'/5</span>'+
      '<p>'+node.desc+'</p>'+
      '<div class="actions">'+
        '<button class="btn pri" id="againBtn">重新开始</button>'+
        '<button class="btn" id="collBtn">结局收藏</button>'+
      '</div>';
    modal.classList.add('on');
    $('againBtn').onclick=()=>{modal.classList.remove('on');reset();};
    $('collBtn').onclick=showCollection;
  }

  function showCollection(){
    const card=$('card');
    const all=[
      ['获救 · 信号','小屋里的对讲机'],['获救 · 黎明','熬过黑夜走向塔'],
      ['获救 · 坚守','原地等待直升机'],['获救 · 火光','第二支信号弹'],['失联','那个睡着的夜晚']
    ];
    let html='<h2>结局收藏</h2><span class="tag">已解锁 '+state.endings.length+' / 5</span><div class="end-list">';
    all.forEach(([name,desc],i)=>{
      const got=state.endings.includes(name);
      html+='<div class="end-item'+(got?'':' lock')+'"><b>'+(got?name:'未解锁 '+(i+1))+'</b><span>'+(got?desc:'???')+'</span></div>';
    });
    html+='</div><div class="actions"><button class="btn" id="closeCol">关闭</button></div>';
    card.innerHTML=html;
    $('modal').classList.add('on');
    $('closeCol').onclick=()=>$('modal').classList.remove('on');
  }

  function reset(){
    state={node:'start',log:[],endings:state.endings.slice(),done:false};
    save();msgsBox.innerHTML='';choicesBox.innerHTML='';
    play('start');
  }

  function restore(){
    const day=document.createElement('div');day.className='day';day.textContent='凌晨 01:47 · 山地信号';
    msgsBox.appendChild(day);
    state.log.forEach(([from,text])=>addBubble(from,text));
    if(state.done){
      choicesBox.innerHTML='';
      const b=document.createElement('button');b.className='choice';
      b.innerHTML='<span class="l">故事已结束 · 查看结局</span><span class="arrow">→</span>';
      b.onclick=showCollection;choicesBox.appendChild(b);
    }else{
      const node=STORY[state.node];
      const lastMsgs=node.msgs.map(m=>m[1]);
      const logged=state.log.map(m=>m[1]);
      const finished=lastMsgs.every(m=>logged.includes(m));
      if(finished)showChoices(node.choices);
      else play(state.node);
    }
  }

  $('skipBtn').onclick=()=>{fast=true;};
  $('endBtn').onclick=showCollection;
  msgsBox.addEventListener('click',()=>{if(running)fast=true;});

  if(state.log.length)restore();
  else{
    const day=document.createElement('div');day.className='day';day.textContent='凌晨 01:47 · 山地信号';
    msgsBox.appendChild(day);
    play('start');
  }
})();
</script>
</body>
</html>
