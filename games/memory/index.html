<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>记忆翻牌</title>
<style>
  :root{--bg:#080b12;--panel:#121826;--line:#242e42;--text:#e5eaf3;--muted:#8a96ac;--dim:#5d687d;--accent:#e5484d;--cyan:#5cc8e8;--green:#6ec9a4;--amber:#e8b45c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh;padding:0 14px calc(30px + env(safe-area-inset-bottom));background:radial-gradient(ellipse 70% 40% at 50% -10%,rgba(169,139,232,.1),transparent 70%),var(--bg)}
  .wrap{max-width:460px;margin:0 auto}
  a.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:12px;padding:16px 0 0;font-family:ui-monospace,monospace}
  a.back:hover{color:var(--cyan)}
  header{display:flex;align-items:flex-end;justify-content:space-between;padding:16px 0 10px;gap:8px}
  h1{font-family:Georgia,serif;font-size:25px;letter-spacing:.08em;margin:0 0 4px}
  .sub{color:var(--muted);font-size:11px;margin:0}
  .stat{text-align:right;font-family:ui-monospace,monospace;flex:0 0 auto;line-height:1.7}
  .stat .v{font-size:19px;color:var(--amber)}
  .stat .l{font-size:9.5px;color:var(--dim)}
  .levels{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .lev{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 11px;font-size:11.5px;cursor:pointer;font-family:inherit}
  .lev.on{background:rgba(92,200,232,.1);border-color:var(--cyan);color:var(--cyan)}
  .hud{display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);margin-bottom:10px}
  .hud b{color:var(--cyan);font-weight:500}
  .board{display:grid;gap:8px}
  .card{position:relative;aspect-ratio:1;perspective:700px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.3,1)}
  .card.flip .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line)}
  .back{background:linear-gradient(145deg,#1c2536,#0e1420);color:#3d4a63;font-size:clamp(16px,4.5vw,24px)}
  .back::after{content:'◇'}
  .front{background:linear-gradient(145deg,#182234,#0d1420);transform:rotateY(180deg);font-size:clamp(22px,6.5vw,34px)}
  .card.matched .front{background:linear-gradient(145deg,rgba(110,201,164,.2),rgba(110,201,164,.06));border-color:rgba(110,201,164,.5)}
  .card.matched{cursor:default}
  .tools{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap;justify-content:center}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px 13px;font-size:11.5px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .msg{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);text-align:center;margin-top:13px;min-height:17px}
  .msg.win{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 返回游戏合集</a>
  <header>
    <div><h1>记忆翻牌</h1><p class="sub">翻开两张，找出一样的那一对</p></div>
    <div class="stat"><div class="v" id="moves">0</div><div class="l">步数 · <span id="clock">0:00</span></div></div>
  </header>
  <div class="levels" id="levels"></div>
  <div class="hud"><span>进度 <b id="progress">0 / 0</b></span><span>最佳 <b id="best">—</b></span></div>
  <div class="board" id="board"></div>
  <div class="tools"><button class="btn" id="newBtn">重新洗牌</button></div>
  <div class="msg" id="msg">点两张牌，相同就留下，不同会翻回去</div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const LV={easy:{n:'轻松',c:4,r:3,p:6},mid:{n:'标准',c:4,r:4,p:8},hard:{n:'挑战',c:6,r:6,p:18}};
const EMO=['🍇','🍒','🍊','🍋','🥝','🍑','🍍','🍉','🐱','🐶','🦊','🐼','🐸','🦁','🐙','🦋','🌸','🌙','⭐','🎈'];
const BKEY='memory_best_v1';
let level='easy',deck=[],first=null,second=null,lock=false,moves=0,matched=0,secs=0,timer=null,done=false;
let best={};try{best=JSON.parse(localStorage.getItem(BKEY)||'{}');}catch(e){}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function init(lv){
  level=lv;const cf=LV[lv];
  deck=shuffle(EMO.slice(0,cf.p).concat(EMO.slice(0,cf.p)));
  first=null;second=null;lock=false;moves=0;matched=0;secs=0;done=false;
  clearInterval(timer);timer=setInterval(()=>{secs++;$('clock').textContent=fmt(secs);},1000);
  const b=$('board');b.style.gridTemplateColumns='repeat('+cf.c+',minmax(0,1fr))';b.innerHTML='';
  deck.forEach((e,i)=>{
    const card=document.createElement('div');card.className='card';card.dataset.i=i;
    card.innerHTML='<div class="inner"><div class="face back"></div><div class="face front">'+e+'</div></div>';
    b.appendChild(card);
  });
  $('moves').textContent='0';$('clock').textContent='0:00';
  $('progress').textContent='0 / '+cf.p;
  $('best').textContent=best[lv]?best[lv].moves+' 步 '+fmt(best[lv].t):'—';
  $('msg').textContent='点两张牌，相同就留下，不同会翻回去';$('msg').className='msg';
  renderLevels();
}
function renderLevels(){
  $('levels').innerHTML='';
  Object.keys(LV).forEach(k=>{
    const b=document.createElement('button');b.className='lev'+(level===k?' on':'');
    b.textContent=LV[k].n+' · '+LV[k].p+' 对';b.onclick=()=>init(k);$('levels').appendChild(b);
  });
}
function flip(el){el.classList.add('flip');}
function check(){
  const a=first,b=second;
  if(deck[Number(a.dataset.i)]===deck[Number(b.dataset.i)]){
    a.classList.add('matched');b.classList.add('matched');
    matched++;$('progress').textContent=matched+' / '+LV[level].p;
    first=null;second=null;
    if(matched===LV[level].p)win();
  }else{
    lock=true;
    setTimeout(()=>{a.classList.remove('flip');b.classList.remove('flip');first=null;second=null;lock=false;},750);
  }
}
function win(){
  done=true;clearInterval(timer);
  const prev=best[level];
  if(!prev||moves<prev.moves||(moves===prev.moves&&secs<prev.t)){
    best[level]={moves:moves,t:secs};try{localStorage.setItem(BKEY,JSON.stringify(best));}catch(e){}
  }
  $('best').textContent=best[level].moves+' 步 '+fmt(best[level].t);
  $('msg').textContent='全部找到！'+moves+' 步，用时 '+fmt(secs)+(!prev||best[level].moves<=prev.moves?' · 新纪录':'');
  $('msg').className='msg win';
}
$('board').addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c||lock||done||c.classList.contains('flip'))return;
  flip(c);moves++;$('moves').textContent=moves;
  if(!first){first=c;return;}
  second=c;check();
});
$('newBtn').onclick=()=>{if(moves&&!confirm('重新洗牌？当前进度会丢失。'))return;init(level);};
init('easy');
})();
</script>
</body>
</html>
