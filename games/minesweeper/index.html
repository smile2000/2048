<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>扫雷 · 每日挑战</title>
<style>
  :root{--bg:#080b12;--panel:#121826;--line:#242e42;--text:#e5eaf3;--muted:#8a96ac;--dim:#5d687d;--accent:#e5484d;--cyan:#5cc8e8;--amber:#e8b45c;--green:#6ec9a4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh;padding:0 14px calc(30px + env(safe-area-inset-bottom));background:radial-gradient(ellipse 70% 40% at 50% -10%,rgba(110,201,164,.09),transparent 70%),var(--bg)}
  .wrap{max-width:440px;margin:0 auto}
  a.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:12px;padding:16px 0 0;font-family:ui-monospace,monospace}
  a.back:hover{color:var(--green)}
  header{padding:16px 0 12px}
  h1{font-family:Georgia,serif;font-size:25px;letter-spacing:.08em;margin:0 0 5px}
  .sub{color:var(--muted);font-size:11.5px;margin:0;line-height:1.7}
  .levels{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 12px}
  .lev{background:none;border:1px solid var(--line);color:var(--muted);font-size:11.5px;padding:7px 11px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s}
  .lev:hover{border-color:#3a465e;color:var(--text)}
  .lev.on{background:rgba(110,201,164,.11);border-color:var(--green);color:var(--green)}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:12px}
  .hud .num{font-family:ui-monospace,monospace;font-size:17px;color:var(--amber)}
  .hud .lbl{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--dim);margin-left:4px}
  .face{background:#0c111b;border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:9px;font-size:19px;cursor:pointer}
  .face:hover{border-color:var(--green)}
  .modeBtn{background:#0c111b;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 10px;font-size:11px;cursor:pointer;font-family:inherit}
  .modeBtn.on{border-color:var(--cyan);color:var(--cyan)}
  .boardWrap{overflow:auto;background:#0d1320;border:1px solid var(--line);border-radius:12px;padding:8px;-webkit-overflow-scrolling:touch}
  .board{display:grid;gap:2px;margin:0 auto}
  .c{aspect-ratio:1;min-width:0;background:#1b2436;border:1px solid #263149;border-radius:4px;display:grid;place-items:center;
    font-family:ui-monospace,monospace;font-size:clamp(11px,3.4vw,16px);font-weight:600;cursor:pointer;color:var(--text);user-select:none}
  .c:hover:not(.open){background:#253149}
  .c.open{background:#111826;border-color:#1b2436;cursor:default}
  .c.flag{color:var(--amber)}
  .c.mine{background:rgba(229,72,77,.22);border-color:var(--accent)}
  .c.wrong{background:rgba(229,72,77,.12);color:var(--accent)}
  .n1{color:#6fa8e8}.n2{color:#6ec9a4}.n3{color:#e88b6e}.n4{color:#a98be8}
  .n5{color:#e8b45c}.n6{color:#5cc8e8}.n7{color:#e5eaf3}.n8{color:#8a96ac}
  .status{margin-top:12px;font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);line-height:1.9}
  .status b{color:var(--green);font-weight:500}
  .status .warn{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 返回游戏合集</a>
  <header>
    <h1>扫雷</h1>
    <p class="sub">左右键 flagged，手机可长按插旗。每日挑战全世界同一布局。</p>
  </header>
  <div class="levels" id="levels"></div>
  <div class="hud">
    <div><span class="num" id="mineNum">10</span><span class="lbl">剩余雷</span></div>
    <button class="face" id="faceBtn" title="重新开始">🙂</button>
    <div><span class="num" id="timeNum">0</span><span class="lbl">秒</span></div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:9px">
    <button class="modeBtn" id="modeBtn">模式：挖开</button>
  </div>
  <div class="boardWrap"><div class="board" id="board"></div></div>
  <div class="status" id="status">第一次点击后才会布雷 · 最高纪录保存在本机</div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const CONF={
 easy:{name:'初级',c:9,r:9,m:10},
 mid:{name:'中级',c:16,r:16,m:40},
 hard:{name:'高级',c:30,r:16,m:99},
 daily:{name:'每日挑战',c:9,r:9,m:10}
};
const BEST_KEY='minesweeper_best_v1';
let mode='easy',board=[],cols=9,rows=9,mines=10,started=false,dead=false,won=false,flags=0,secs=0,timer=null,digMode=true,longTimer=null,longFired=false;
let best={};try{best=JSON.parse(localStorage.getItem(BEST_KEY)||'{}');}catch(e){}

function seedFrom(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function init(k){
  mode=k;const cf=CONF[k];cols=cf.c;rows=cf.r;mines=cf.m;
  board=Array.from({length:rows},()=>Array.from({length:cols},()=>({mine:false,near:0,open:false,flag:false})));
  started=false;dead=false;won=false;flags=0;secs=0;longFired=false;
  clearInterval(timer);timer=null;
  $('mineNum').textContent=mines;$('timeNum').textContent='0';$('faceBtn').textContent='🙂';
  const b=$('board');b.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
  b.style.width=cols>=30?'860px':(cols>=16?'600px':'360px');
  b.innerHTML='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const d=document.createElement('div');d.className='c';d.dataset.r=r;d.dataset.c=c;
    b.appendChild(d);
  }
  renderLevels();status('第一次点击后才会布雷 · 最高纪录保存在本机');
}
function renderLevels(){
  const box=$('levels');box.innerHTML='';
  Object.keys(CONF).forEach(k=>{
    const b=document.createElement('button');b.className='lev'+(mode===k?' on':'');
    b.textContent=CONF[k].name+(best[k]?' · '+best[k]+'s':'');
    b.onclick=()=>init(k);box.appendChild(b);
  });
}
function place(sr,sc){
  if(mode==='daily')placeSeeded(sr,sc);else placeRandom(sr,sc);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(board[r][c].mine)continue;
    let n=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;
      if(rr>=0&&rr<rows&&cc>=0&&cc<cols&&board[rr][cc].mine)n++;
    }
    board[r][c].near=n;
  }
  started=true;
  timer=setInterval(()=>{secs++;$('timeNum').textContent=secs;},1000);
}
function placeRandom(sr,sc){
  const pool=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;pool.push([r,c]);
  }
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  for(let i=0;i<mines&&i<pool.length;i++)board[pool[i][0]][pool[i][1]].mine=true;
}
function placeSeeded(sr,sc){
  const rand=rng(seedFrom(todayStr()));const idx=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)idx.push(r*cols+c);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  for(let i=0;i<mines;i++){const k=idx[i];board[Math.floor(k/cols)][k%cols].mine=true;}
  if(board[sr][sc].mine){
    let swap=-1;
    for(let k=0;k<rows*cols;k++){const r=Math.floor(k/cols),c=k%cols;if(!board[r][c].mine){swap=k;break;}}
    board[sr][sc].mine=false;
    if(swap>=0)board[Math.floor(swap/cols)][swap%cols].mine=true;
  }
}
function cell(r,c){return $('board').children[r*cols+c];}
function paint(r,c){
  const x=cell(r,c),v=board[r][c];
  x.className='c'+(v.open?' open':'')+(v.flag?' flag':'')+(v.mine&&v.open?' mine':'')+(v.flag&&v.open?' wrong':'');
  x.textContent=v.open?(v.mine?'💣':(v.near||'')):(v.flag?'🚩':'');
  if(v.open&&v.near)x.classList.add('n'+v.near);
}
function flood(r,c){
  const stack=[[r,c]];
  while(stack.length){
    const [rr,cc]=stack.pop(),v=board[rr][cc];
    if(v.open||v.flag||v.mine)continue;
    v.open=true;paint(rr,cc);
    if(v.near===0){
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        const nr=rr+dr,nc=cc+dc;
        if((nr!==rr||nc!==cc)&&nr>=0&&nr<rows&&nc>=0&&nc<cols&&!board[nr][nc].open)stack.push([nr,nc]);
      }
    }
  }
}
function reveal(r,c){
  if(dead||won)return;
  const v=board[r][c];
  if(v.flag)return;
  if(v.open){chord(r,c);return;}
  if(!started)place(r,c);
  if(v.mine){v.open=true;paint(r,c);lose();return;}
  flood(r,c);checkWin();
}
function chord(r,c){
  const v=board[r][c];if(!v.open||!v.near)return;
  let f=0;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    const rr=r+dr,cc=c+dc;
    if((rr===r&&cc===c)||rr<0||rr>=rows||cc<0||cc>=cols)continue;
    if(board[rr][cc].flag)f++;
  }
  if(f!==v.near)return;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    const rr=r+dr,cc=c+dc;
    if((rr===r&&cc===c)||rr<0||rr>=rows||cc<0||cc>=cols)continue;
    const x=board[rr][cc];if(!x.open&&!x.flag&&x.mine){x.open=true;paint(rr,cc);lose();return;}
    if(!x.open&&!x.flag)flood(rr,cc);
  }
  checkWin();
}
function toggleFlag(r,c){
  if(dead||won||board[r][c].open)return;
  const v=board[r][c];v.flag=!v.flag;flags+=v.flag?1:-1;
  $('mineNum').textContent=mines-flags;paint(r,c);
}
function lose(){
  dead=true;clearInterval(timer);$('faceBtn').textContent='😵';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const v=board[r][c];
    if(v.mine&&!v.flag){v.open=true;paint(r,c);}
    if(v.flag&&!v.mine){cell(r,c).classList.add('wrong');}
  }
  status('<span class="warn">踩雷了。点笑脸或换个难度再来。</span>');
}
function checkWin(){
  let left=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!board[r][c].open&&!board[r][c].mine)left++;
  if(left)return;
  won=true;clearInterval(timer);$('faceBtn').textContent='😎';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(board[r][c].mine&&!board[r][c].flag){board[r][c].flag=true;paint(r,c);}
  flags=mines;$('mineNum').textContent='0';
  const old=best[mode];
  if(!old||secs<old){best[mode]=secs;try{localStorage.setItem(BEST_KEY,JSON.stringify(best));}catch(e){}}
  renderLevels();status('<b>通关！用时 '+secs+' 秒。'+(old&&secs>=old?'纪录仍是 '+old+' 秒。':'新纪录！')+'</b>');
}
function status(s){$('status').innerHTML=s;}

$('board').addEventListener('click',e=>{
  if(longFired){longFired=false;return;}
  const t=e.target.closest('.c');if(!t)return;
  const r=Number(t.dataset.r),c=Number(t.dataset.c);
  if(digMode)reveal(r,c);else toggleFlag(r,c);
});
$('board').addEventListener('contextmenu',e=>{
  const t=e.target.closest('.c');if(!t)return;e.preventDefault();
  toggleFlag(Number(t.dataset.r),Number(t.dataset.c));
});
$('board').addEventListener('touchstart',e=>{
  const t=e.target.closest('.c');if(!t)return;
  const r=Number(t.dataset.r),c=Number(t.dataset.c);
  longFired=false;
  longTimer=setTimeout(()=>{longFired=true;toggleFlag(r,c);setTimeout(()=>{longFired=false;},700);},480);
},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>$('board').addEventListener(ev,()=>clearTimeout(longTimer),{passive:true}));
$('faceBtn').onclick=()=>init(mode);
$('modeBtn').onclick=()=>{
  digMode=!digMode;$('modeBtn').textContent='模式：'+(digMode?'挖开':'插旗');
  $('modeBtn').classList.toggle('on',!digMode);
};
init('easy');
})();
</script>
</body>
</html>
