<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小恐龙快跑 · 午夜站台</title>
<style>
  :root{--bg:#080b12;--panel:#121826;--line:#242e42;--text:#e5eaf3;--muted:#8a96ac;--dim:#5d687d;--green:#6ec9a4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse 70% 45% at 15% -5%,rgba(110,201,164,.08),transparent 70%),var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px 44px}
  .wrap{width:100%;max-width:860px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .top h1{font-family:Georgia,"Songti SC",serif;font-size:24px;letter-spacing:.08em;margin:0;font-weight:600}
  .top .back{color:var(--muted);font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px}
  .top .back:hover{color:var(--green);border-color:var(--green)}
  .scorebar{display:flex;gap:22px;font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:14px}
  .scorebar b{color:var(--text);font-weight:600}
  .stage{position:relative;width:100%;height:clamp(190px,29vw,260px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#101620;cursor:pointer;user-select:none}
  canvas{display:block;width:100%;height:100%}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(8,11,18,.55);backdrop-filter:blur(2px);text-align:center;padding:16px}
  .overlay.hide{display:none}
  .overlay .big{font-family:ui-monospace,monospace;font-size:13px;letter-spacing:.2em;color:var(--green)}
  .overlay .small{font-size:13px;color:var(--muted);line-height:1.8}
  .overlay .small b{color:var(--text)}
  .ctrl{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  button{font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 16px;cursor:pointer;transition:.18s}
  button:hover{border-color:var(--green);color:var(--green)}
  button.primary{background:rgba(110,201,164,.13);border-color:rgba(110,201,164,.5);color:var(--green)}
  .help{margin-top:18px;color:var(--dim);font-size:12px;line-height:2;text-align:center}
  .help kbd{font-family:ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>小恐龙快跑</h1>
    <a class="back" href="../">← 游戏合集</a>
  </div>
  <div class="scorebar"><span>得分 <b id="score">0</b></span><span>最高 <b id="best">0</b></span><span id="mode">夜色</span></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <div class="big">T-REX RUNNER</div>
      <div class="small" id="msg">按 <b>空格</b> 或点击画面开始<br>跳过仙人掌，别撞上翼龙</div>
    </div>
  </div>
  <div class="ctrl">
    <button class="primary" id="jumpBtn">跳跃</button>
    <button id="duckBtn">下蹲</button>
    <button id="nightBtn">切换昼夜</button>
    <button id="resetBtn">重新开始</button>
  </div>
  <div class="help"><kbd>空格</kbd> / <kbd>↑</kbd> / 点击 跳跃　<kbd>↓</kbd> / 下滑 下蹲　手机可直接点上方按钮</div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage'), overlay=$('overlay'), msg=$('msg');
  const KEY='dino_best_v1';
  let best=+(localStorage.getItem(KEY)||0);
  $('best').textContent=best;
  let night=true, W=800,H=220, groundY=190, dpr=1;
  let state='idle', score=0, speed=6, spawnTimer=60, runFrame=0, cloudSeed=[];
  const dino={x:56,y:0,vy:0,duck:false,dead:false,jumping:false};
  let obstacles=[], clouds=[];
  const DH=42, DUCKH=24;

  function resize(){
    const r=stage.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=r.width; H=r.height;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    groundY=H-26;
    if(state==='idle'){dino.y=groundY-DH;}
  }
  window.addEventListener('resize',resize);

  function reset(){
    state='idle'; score=0; speed=6; spawnTimer=50; runFrame=0;
    dino.y=groundY-DH; dino.vy=0; dino.duck=false; dino.dead=false; dino.jumping=false;
    obstacles=[]; clouds=[{x:W*.3,y:H*.25,s:1},{x:W*.7,y:H*.18,s:.7},{x:W*1.2,y:H*.3,s:1.2}];
    $('score').textContent='0';
    msg.innerHTML='按 <b>空格</b> 或点击画面开始<br>跳过仙人掌，别撞上翼龙';
    overlay.classList.remove('hide');
  }
  function start(){
    state='run'; overlay.classList.add('hide');
  }
  function jump(){
    if(state==='idle'||state==='over'){start(); if(state==='run'&&!dino.jumping)doJump(); return;}
    if(state==='run'&&!dino.jumping)doJump();
  }
  function doJump(){dino.vy=-11.2;dino.jumping=true;dino.duck=false;}
  function setDuck(v){
    if(state!=='run')return;
    dino.duck=v&&!dino.jumping;
  }
  function spawn(){
    const bird=score>260&&Math.random()<.28;
    if(bird){
      const large=Math.random()<.35;
      obstacles.push({type:'bird',x:W+20,w:large?42:34,y:groundY-(large?78:62)-Math.random()*28,h:large?24:20,ph:Math.random()*6});
    }else{
      const big=Math.random()<.45, count=Math.random()<.35?2:1;
      for(let i=0;i<count;i++){
        const w=big?24:16,h=big?52:36;
        obstacles.push({type:'cactus',x:W+20+i*(w+10),w:w,h:h,y:groundY-h});
      }
    }
  }
  function box(d){
    if(d.duck)return{x:d.x+3,y:d.y+4,w:42,h:18};
    return{x:d.x+5,y:d.y+3,w:32,h:37};
  }
  function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
  function update(f){
    runFrame+=f;
    speed=6+Math.min(score/110,5.5);
    score+=speed*.055;
    $('score').textContent=Math.floor(score);
    dino.vy+=.56*f; dino.y+=dino.vy*f;
    if(dino.y>=groundY-DH){dino.y=groundY-DH;dino.vy=0;dino.jumping=false;}
    clouds.forEach(c=>{c.x-=speed*.22*f;if(c.x<-90)c.x=W+60+Math.random()*120;});
    obstacles.forEach(o=>{
      o.x-=speed*f;
      if(o.type==='bird')o.ph+=.12*f;
    });
    obstacles=obstacles.filter(o=>o.x+o.w>-20);
    spawnTimer-=f;
    const last=obstacles.length?Math.max.apply(null,obstacles.map(o=>o.x+o.w)):0;
    if(spawnTimer<=0&&(last<W-140)){spawn();spawnTimer=(130+Math.random()*190)/(speed/6);}
    const b=box(dino);
    for(const o of obstacles){
      let ob;
      if(o.type==='bird')ob={x:o.x+3,y:o.y+3+Math.sin(o.ph)*5,w:o.w-6,h:o.h-8};
      else ob={x:o.x+3,y:o.y+2,w:o.w-6,h:o.h-2};
      if(hit(b,ob)){
        state='over';dino.dead=true;
        if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem(KEY,best);$('best').textContent=best;}
        msg.innerHTML='撞到了。得分 <b>'+Math.floor(score)+'</b> · 最高 <b>'+best+'</b><br>按空格或点击画面再来一局';
        overlay.classList.remove('hide');
        break;
      }
    }
  }
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill();}
  function drawDino(){
    const c=night?'#e8edf5':'#43505f', d=night?'#101620':'#f7f8fa';
    const x=dino.x,y=dino.y;
    ctx.fillStyle=c;
    if(dino.duck){
      roundRect(x+4,y+8,34,14,4);roundRect(x+31,y+1,15,14,4);
      ctx.fillRect(x+4,y+20,6,5);ctx.fillRect(x+30,y+20,6,5);
      ctx.fillStyle=d;ctx.fillRect(x+41,y+6,3,3);
      ctx.fillStyle=c;ctx.fillRect(x+43,y+11,4,3);
    }else{
      ctx.beginPath();ctx.moveTo(x+3,y+29);ctx.lineTo(x+16,y+23);ctx.lineTo(x+16,y+37);ctx.closePath();ctx.fill();
      roundRect(x+13,y+17,22,21,4);
      roundRect(x+29,y+1,15,21,4);
      ctx.fillRect(x+38,y+14,7,6);
      ctx.fillRect(x+31,y+24,8,4);
      const step=Math.floor(runFrame/7)%2;
      if(!dino.jumping){
        ctx.fillRect(x+17+(step?3:0),y+36,6,7);
        ctx.fillRect(x+27-(step?3:0),y+36,6,7);
      }else{
        ctx.fillRect(x+18,y+34,6,7);ctx.fillRect(x+29,y+31,6,6);
      }
      ctx.fillStyle=d;
      if(dino.dead){ctx.fillRect(x+36,y+6,3,3);ctx.fillRect(x+41,y+6,3,3);ctx.fillStyle=c;ctx.fillRect(x+37,y+7,1,1);ctx.fillRect(x+42,y+7,1,1);}
      else ctx.fillRect(x+38,y+6,4,4);
    }
  }
  function drawCactus(o){
    ctx.fillStyle=night?'#4f9c72':'#3c7a4e';
    roundRect(o.x+o.w*.34,o.y,o.w*.32,o.h,4);
    if(o.h>44){
      roundRect(o.x+o.w*.02,o.y+o.h*.4,o.w*.28,6,3);
      ctx.fillRect(o.x+o.w*.02,o.y+o.h*.22,o.w*.22,o.h*.22);
      roundRect(o.x+o.w*.72,o.y+o.h*.28,o.w*.28,6,3);
      ctx.fillRect(o.x+o.w*.78,o.y+o.h*.1,o.w*.2,o.h*.22);
    }else{
      roundRect(o.x+o.w*.72,o.y+o.h*.4,o.w*.28,5,2);
      ctx.fillRect(o.x+o.w*.82,o.y+o.h*.2,o.w*.18,o.h*.24);
    }
  }
  function drawBird(o){
    const c=night?'#c7d2e4':'#4b5563';ctx.fillStyle=c;
    const flap=Math.sin(o.ph)*5;
    ctx.beginPath();ctx.moveTo(o.x+2,o.y+10-flap);ctx.lineTo(o.x+o.w*.5,o.y+6);ctx.lineTo(o.x+o.w-2,o.y+11+flap);
    ctx.lineTo(o.x+o.w*.55,o.y+15);ctx.closePath();ctx.fill();
    roundRect(o.x+o.w*.25,o.y+8,o.w*.5,8,3);
    ctx.fillStyle=night?'#101620':'#f7f8fa';ctx.fillRect(o.x+o.w*.62,o.y+10,3,3);
  }
  function draw(){
    ctx.fillStyle=night?'#101620':'#f7f8fa';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=night?'rgba(232,237,245,.18)':'rgba(80,90,105,.18)';
    clouds.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,8*c.s,0,7);ctx.arc(c.x+11*c.s,c.y-4*c.s,11*c.s,0,7);ctx.arc(c.x+24*c.s,c.y,8*c.s,0,7);ctx.fill();});
    ctx.strokeStyle=night?'#4a5468':'#9aa2ad';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,groundY+.5);ctx.lineTo(W,groundY+.5);ctx.stroke();
    ctx.fillStyle=night?'#4a5468':'#9aa2ad';
    const off=Math.floor(score*2)%24;
    for(let x=-off;x<W;x+=24)ctx.fillRect(x,groundY+6,10,2);
    obstacles.forEach(o=>o.type==='bird'?drawBird(o):drawCactus(o));
    drawDino();
  }
  let last=0;
  function loop(t){
    requestAnimationFrame(loop);
    if(!last)last=t;
    const dt=Math.min(t-last,40);last=t;
    if(state==='run')update(dt/16.667);
    draw();
  }
  stage.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
  $('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();jump();});
  const duckBtn=$('duckBtn');
  duckBtn.addEventListener('pointerdown',e=>{e.preventDefault();setDuck(true);});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>duckBtn.addEventListener(t,e=>{e.preventDefault();setDuck(false);}));
  $('nightBtn').onclick=()=>{night=!night;$('mode').textContent=night?'夜色':'白昼';$('nightBtn').textContent=night?'切换昼夜':'切换昼夜';};
  $('resetBtn').onclick=reset;
  document.addEventListener('keydown',e=>{
    if(['Space','ArrowUp','ArrowDown','KeyW','KeyS'].includes(e.code))e.preventDefault();
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();
    if(e.code==='ArrowDown'||e.code==='KeyS')setDuck(true);
  });
  document.addEventListener('keyup',e=>{if(e.code==='ArrowDown'||e.code==='KeyS')setDuck(false);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run'){}last=0;});
  resize();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
